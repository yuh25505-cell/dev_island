name: 打包APK

on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装打包工具
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!n}" ]; then
              echo "缺少 Secret：$n"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/island.jks"

      - name: 打包并签名
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/island.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ISLAND_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: 发布 APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')
          BRANCH="${GITHUB_REF_NAME}"
          APK="IslandPhone-v${VERSION}-${BRANCH}-${RUN}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          TAG="${BRANCH}-v${VERSION}-${RUN}"
          FLAGS=""
          if [ "$BRANCH" != "main" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "岛屿机 v${VERSION}（${BRANCH} #${RUN}）" \
            --notes "分支：${BRANCH}，版本：${VERSION}，构建序号：${RUN}" \
            $FLAGS
