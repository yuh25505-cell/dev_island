name: Android APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          sdkmanager --licenses </dev/null || true
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IslandPhone-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
      - name: Build signed Release if signing secrets are configured
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_KEY_ALIAS" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            export SIGNING_KEYSTORE_FILE="$PWD/release-keystore.jks"
            gradle assembleRelease
          else
            echo "Signing secrets not configured; skipping signed Release APK."
          fi
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IslandPhone-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
